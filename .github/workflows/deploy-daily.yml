name: Build and release daily reader

on:
  pull_request:
    paths:
      - apps/daily/**
      - content/digests/**
      - scripts/daily-release.py
      - scripts/publication.py
      - scripts/publish-from-vault.sh
      - scripts/sync-content-from-vault.sh
      - hermes/ai-x-digest/**
      - .github/workflows/deploy-daily.yml
  push:
    branches: [main]
    paths:
      - apps/daily/**
      - content/digests/**
      - scripts/daily-release.py
      - scripts/publication.py
      - scripts/publish-from-vault.sh
      - scripts/sync-content-from-vault.sh
      - hermes/ai-x-digest/**
      - .github/workflows/deploy-daily.yml
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Allow the explicitly authorized first deployment when deployment.json returns 404
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: apps/daily/package-lock.json
      - run: npm ci
        working-directory: apps/daily
      - run: npm run check
        working-directory: apps/daily
      - run: npm test
        working-directory: apps/daily
      - run: npm run build
        working-directory: apps/daily
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: jdx/mise-action@v4
        with:
          tool_versions: |
            node 22.23.3
      - name: Check publication, identity, editorial, and source contracts
        shell: bash
        run: |
          python3 -m unittest discover -s hermes/ai-x-digest/tests -p test_publishing.py
          python3 -m unittest discover -s hermes/ai-x-digest/tests -p test_daily_release.py
          python3 -m unittest discover -s hermes/ai-x-digest/tests -p test_editorial_format.py
          python3 -m unittest discover -s hermes/ai-x-digest/tests -p test_editorial_visible_sources.py
          python3 -m unittest discover -s hermes/ai-x-digest/tests -p test_source_adjacency.py
          python3 -m unittest discover -s hermes/ai-x-digest/tests -p test_story_identity.py
          python3 -m unittest discover -s hermes/ai-x-digest/tests -p test_compatibility.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-${{ github.sha }}
          path: apps/daily/dist
          if-no-files-found: error

  production:
    needs: build
    # Activation requires a later deliberate repository setting and environment approval.
    if: github.ref == 'refs/heads/main' && vars.DAILY_PRODUCTION_ENABLED == 'true'
    environment: daily-production
    concurrency:
      group: daily-production
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DAILY_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.DAILY_CLOUDFLARE_API_TOKEN }}
      DAILY_ORIGIN: ${{ vars.DAILY_ORIGIN }}
      PUBLISH_STATE_DIR: ${{ runner.temp }}/daily-release-state
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: apps/daily/package-lock.json
      - run: npm ci
        working-directory: apps/daily
      - uses: actions/download-artifact@v4
        with:
          name: daily-${{ github.sha }}
          path: apps/daily/dist
      - name: Require the configured authority and origin
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$DAILY_ORIGIN"
      - name: Read the current Cloudflare deployment version
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        shell: bash
        run: |
          args=()
          if [[ "$BOOTSTRAP" == 'true' ]]; then args+=(--bootstrap); fi
          python3 scripts/daily-release.py cloudflare-deployments "${args[@]}" > "$RUNNER_TEMP/daily-before.json"
      - name: Refuse old revisions and deploy the complete build artifact
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        shell: bash
        run: |
          args=()
          if [[ "$BOOTSTRAP" == 'true' ]]; then args+=(--bootstrap); fi
          python3 scripts/daily-release.py deploy --artifact apps/daily/dist --origin "$DAILY_ORIGIN" "${args[@]}" -- apps/daily/node_modules/.bin/wrangler --cwd apps/daily deploy --message "$GITHUB_SHA"
      - name: Read the deployed Cloudflare version
        run: python3 scripts/daily-release.py cloudflare-deployments > "$RUNNER_TEMP/daily-after.json"
      - name: Verify actual public routes and emit exact date redirects
        shell: bash
        run: |
          version="$(python3 scripts/daily-release.py version --deployments "$RUNNER_TEMP/daily-after.json")"
          python3 scripts/daily-release.py verify --artifact apps/daily/dist --origin "$DAILY_ORIGIN" --version "$version"
      - name: Publish the verified date mapping for the activation consumer
        uses: actions/upload-artifact@v4
        with:
          name: daily-verified-redirects-${{ github.sha }}
          path: ${{ runner.temp }}/daily-release-state/verified-redirects.json
          if-no-files-found: error
