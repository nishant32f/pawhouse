name: Build and test daily reader

on:
  pull_request:
    paths:
      - apps/daily/**
      - content/digests/**
      - scripts/daily-release.py
      - scripts/release-daily-from-pluto.py
      - scripts/publication.py
      - scripts/publish-from-vault.sh
      - scripts/sync-content-from-vault.sh
      - hermes/ai-x-digest/**
      - .github/workflows/deploy-daily.yml
  push:
    branches: [main]
    paths:
      - apps/daily/**
      - content/digests/**
      - scripts/daily-release.py
      - scripts/release-daily-from-pluto.py
      - scripts/publication.py
      - scripts/publish-from-vault.sh
      - scripts/sync-content-from-vault.sh
      - hermes/ai-x-digest/**
      - .github/workflows/deploy-daily.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: apps/daily/package-lock.json
      - run: npm ci
        working-directory: apps/daily
      - run: npm run check
        working-directory: apps/daily
      - run: npm test
        working-directory: apps/daily
      - run: npm run build
        working-directory: apps/daily
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: jdx/mise-action@v4
        with:
          tool_versions: |
            node 22.23.3
      - name: Check publication, identity, editorial, and source contracts
        shell: bash
        run: |
          python3 -m unittest discover -s hermes/ai-x-digest/tests
      - uses: actions/upload-artifact@v4
        with:
          name: daily-${{ github.sha }}
          path: apps/daily/dist
          if-no-files-found: error
